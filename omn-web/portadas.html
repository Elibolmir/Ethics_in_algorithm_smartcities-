<title>Portada OMN Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Nunito:wght@400;600&family=Caveat:wght@500;600&family=Lexend:wght@400&display=swap">
<style>
/* Two front pages to choose from, both faithful to Elisabet's drawing:
   A "Tu dibujo, vivo": her hand-drawn ovals and brace, in her pen's ink, with soft watercolour.
   B "Luz": the same layout, cleaner, with frosted-glass buttons and a gentle aurora behind the logo. */
:root{
  --paper:#ffffff;
  --ink:#2e3a8c;          /* her pen's ink, softened */
  --ink-text:#2b3366;
  --ink-soft:#6a7096;
  --blue:#5b7cf0; --blue-soft:#eef2ff;
  --orange:#ffab78; --orange-soft:#fff3ea;
  --pink:#f4a9bc; --pink-soft:#fff0f4;
  --rg1:#f7d3c8; --rg2:#d99a8a; --rg3:#b9786a;   /* rose gold */
  --font-head:"Quicksand","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --font-hand:"Caveat","Segoe Print",cursive;
  --scale:1;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(17px * var(--scale))}
body{margin:0;background:var(--paper);color:var(--ink-text);font-family:var(--font-body);line-height:1.6;overflow-x:hidden}
:root.dys body,:root.dys .btn-o,:root.dys .area b{font-family:"Lexend",var(--font-body);letter-spacing:.03em}
:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:12px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* version switch (only for choosing) */
.choose{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;background:#fff;border-radius:99px;box-shadow:0 14px 34px -14px rgba(46,58,140,.45);border:1px solid #e9ebf7}
.choose button{font:inherit;font-family:var(--font-head);font-weight:600;border:0;border-radius:99px;padding:10px 18px;cursor:pointer;background:transparent;color:var(--ink-text)}
.choose button[aria-pressed="true"]{background:var(--ink);color:#fff}
.choose button{white-space:nowrap}
@media (max-width:480px){.choose button{padding:9px 13px;font-size:.85rem}}

/* header (shared) */
header{position:relative;z-index:5}
.bar{display:flex;align-items:center;gap:14px;padding-block:18px}
.circle{flex:none;width:60px;height:60px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink);background:#fff;border:0;position:relative}
.circle svg.lines{width:26px;height:26px}
.circle svg.ring{position:absolute;inset:-4px;width:68px;height:68px;overflow:visible}
nav.titles{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 26px}
nav.titles a{font-family:var(--font-head);font-weight:500;font-size:1.02rem;color:var(--ink-text);text-decoration:none;padding:6px 2px;position:relative}
nav.titles a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--pink));transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
nav.titles a:hover::after{transform:scaleX(1)}
@media (max-width:760px){nav.titles{gap:2px 12px}nav.titles a{font-size:.85rem}}

/* panel */
.panel{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 90px);left:max(16px,env(safe-area-inset-left,0px));width:min(360px,calc(100vw - 32px));background:#fff;border-radius:28px;padding:22px;box-shadow:0 30px 60px -24px rgba(46,58,140,.35);border:1px solid #eceefa}
.panel h2{font-family:var(--font-head);font-weight:600;font-size:1.25rem;margin:0 0 10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f0f1f8}
.pill{font:inherit;font-weight:600;font-size:.85rem;border:1.5px solid #e2e5f5;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--ink-text)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* front (shared skeleton) */
.front{position:relative;min-height:calc(100vh - 96px);overflow:hidden;display:flex;flex-direction:column}
.logo-bg{position:absolute;left:50%;top:50%;width:min(860px,118vw);transform:translate(-50%,-48%);pointer-events:none;z-index:0}
.logo-bg svg{width:100%;height:auto;display:block;overflow:visible}
.breath{transform-origin:50% 50%;animation:breath 9s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.ui{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,.8fr) 64px minmax(0,1.3fr);gap:18px;align-items:center;padding-block:10px 90px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
.brace{align-self:stretch;display:flex}
.brace svg{width:64px;height:100%}
.areas{display:grid;gap:14px;min-width:0}
.btn-o,.area{position:relative;font:inherit;cursor:pointer;color:var(--ink-text);text-decoration:none;background:transparent;border:0}
.btn-o{font-family:var(--font-head);font-weight:600;font-size:1.08rem;padding:14px 30px}
.area{display:block;text-align:left;padding:18px 34px}
.area b{display:block;font-family:var(--font-head);font-weight:600;font-size:1.22rem;color:var(--ink-text)}
.area span{display:block;font-size:.95rem;color:var(--ink-soft)}
.help{margin:6px 0}
@media (max-width:900px){.ui{grid-template-columns:1fr}.brace{display:none}}
.word{position:relative;z-index:1;text-align:center;padding-top:6px}
.word .tag{display:inline-block;font-family:var(--font-head);font-weight:500;color:var(--ink-soft);letter-spacing:.06em}

/* ===== A: Tu dibujo, vivo ===== */
.vA{background:#fff}
.vA .wash{position:absolute;border-radius:50%;filter:url(#water) blur(18px);opacity:.75;z-index:0}
.vA .w1{width:520px;height:440px;left:-120px;top:14%;background:radial-gradient(circle,var(--orange-soft) 0 45%,rgba(255,171,120,.25) 70%,transparent 72%)}
.vA .w2{width:520px;height:480px;right:-140px;bottom:2%;background:radial-gradient(circle,var(--pink-soft) 0 45%,rgba(244,169,188,.28) 70%,transparent 72%)}
.vA .w3{width:420px;height:380px;left:42%;top:-6%;background:radial-gradient(circle,var(--blue-soft) 0 45%,rgba(91,124,240,.18) 70%,transparent 72%)}
.vA .logo-fill{fill:url(#inkWash)}
.vA .hand{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.vA .hand path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.vA .btn-o:hover .hand path,.vA .area:hover .hand path{stroke:var(--orange);stroke-width:2.2}
.vA .area.eq .hand path{stroke:var(--pink)}
.vA .area .fill{position:absolute;inset:6px 8px;border-radius:999px;background:rgba(255,255,255,.72);z-index:-1}
.vA .btn-o .fill{position:absolute;inset:6px;border-radius:999px;background:rgba(255,255,255,.8);z-index:-1}
.vA .help{font-family:var(--font-hand);font-weight:600;font-size:clamp(2.2rem,4vw,3rem);line-height:1;color:var(--ink)}
.vA .help em{font-style:normal;color:var(--orange)}
.vA .best{color:var(--ink)}
.vA .best .fill{background:linear-gradient(90deg,var(--orange-soft),var(--pink-soft))}
.vA .word b{display:block;font-family:var(--font-hand);font-weight:600;font-size:clamp(2rem,3.4vw,2.8rem);color:var(--ink);line-height:1}

/* ===== B: Luz ===== */
.vB{background:radial-gradient(800px 520px at 18% 30%,var(--orange-soft),transparent 70%),radial-gradient(760px 560px at 85% 75%,var(--pink-soft),transparent 70%),radial-gradient(700px 500px at 55% 10%,var(--blue-soft),transparent 70%),#fff}
.vB .logo-fill{fill:url(#glass)}
.vB .btn-o,.vB .area{background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 10px 30px -18px rgba(46,58,140,.35);transition:transform .25s ease, box-shadow .25s ease}
.vB .btn-o:hover,.vB .area:hover{transform:translateY(-3px);box-shadow:0 18px 40px -20px rgba(46,58,140,.45)}
.vB .area{display:flex;align-items:center;gap:16px}
.vB .area i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.vB .area.eq{background:linear-gradient(110deg,rgba(91,124,240,.92),rgba(244,169,188,.92));border-color:transparent}
.vB .area.eq b,.vB .area.eq span{color:#fff}
.vB .help{font-family:var(--font-head);font-weight:500;font-size:clamp(1.9rem,3.2vw,2.5rem);line-height:1.15;color:var(--ink)}
.vB .help em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.vB .best{background:linear-gradient(90deg,rgba(255,243,234,.9),rgba(255,240,244,.9))}
.vB .word b{display:block;font-family:var(--font-head);font-weight:600;font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:.28em;color:var(--ink)}
.vB .hand{display:none}
.vB .fill{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root.calm *{animation:none!important;transition:none!important}
</style>

<script>
(() => {
  const root = document.documentElement, front = document.getElementById('front');
  const S = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

  /* hand-drawn outlines: two loose passes around each button, like a pen sketch */
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const loop = (w, h, j) => {
    const rx = w / 2, ry = h / 2, cx = rx, cy = ry, n = 28, pts = [];
    for (let i = 0; i <= n + 2; i++){
      const a = (i / n) * Math.PI * 2 + .25;
      const k = Math.min(1, Math.abs(Math.cos(a)) * 1.8);
      const ex = cx + Math.cos(a) * (rx - 2) * (0.88 + 0.12 * k) + (rnd() - .5) * j;
      const ey = cy + Math.sin(a) * (ry - 2) + (rnd() - .5) * j;
      pts.push([ex, ey]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++){ const [x, y] = pts[i], [nx, ny] = pts[i + 1]; d += ` Q${x.toFixed(1)} ${y.toFixed(1)} ${((x + nx) / 2).toFixed(1)} ${((y + ny) / 2).toFixed(1)}`; }
    return d;
  };
  const sketch = () => {
    document.querySelectorAll('.btn-o, .area').forEach(el => {
      el.querySelector('svg.hand')?.remove();
      const w = el.offsetWidth, h = el.offsetHeight;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'hand'); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = `<path d="${loop(w, h, 3)}"/><path d="${loop(w, h, 5)}" style="opacity:.45"/>`;
      el.prepend(svg);
    });
    const ring = document.querySelector('.hand-ring');
    ring.innerHTML = `<path d="${loop(68, 68, 3)}" style="fill:none;stroke:#2e3a8c;stroke-width:1.6;stroke-linecap:round"/><path d="${loop(68, 68, 4)}" style="fill:none;stroke:#ffab78;stroke-width:1.4;opacity:.7"/>`;
  };

  /* choose a version */
  const pick = v => {
    front.classList.toggle('vA', v === 'A'); front.classList.toggle('vB', v === 'B');
    document.getElementById('pickA').setAttribute('aria-pressed', String(v === 'A'));
    document.getElementById('pickB').setAttribute('aria-pressed', String(v === 'B'));
    S.set('omn-front', v);
  };
  document.getElementById('pickA').onclick = () => pick('A');
  document.getElementById('pickB').onclick = () => pick('B');
  pick(S.get('omn-front') === 'B' ? 'B' : 'A');
  sketch(); let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(sketch, 150); });
  document.fonts?.ready.then(sketch);

  /* accessibility circle */
  const panel = document.getElementById('panel'), menu = document.getElementById('menu');
  menu.onclick = () => { panel.hidden = !panel.hidden; menu.setAttribute('aria-expanded', String(!panel.hidden)); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden){ panel.hidden = true; menu.setAttribute('aria-expanded','false'); menu.focus(); } });
  let scale = 1; const setScale = () => { root.style.setProperty('--scale', scale); setTimeout(sketch, 50); };
  document.getElementById('oPlus').onclick = () => { scale = Math.min(1.5, scale + .1); setScale(); };
  document.getElementById('oMinus').onclick = () => { scale = Math.max(.9, scale - .1); setScale(); };
  document.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => { const on = !root.classList.contains(b.dataset.flag); root.classList.toggle(b.dataset.flag, on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Sí' : 'No'; setTimeout(sketch, 50); });
  const rb = document.getElementById('oRead');
  rb.onclick = () => { const s = window.speechSynthesis; if (!s) return; if (s.speaking){ s.cancel(); rb.textContent = 'Escuchar'; return; } const u = new SpeechSynthesisUtterance(front.innerText.replace(/\s+/g,' ')); u.lang = 'es-ES'; u.onend = () => rb.textContent = 'Escuchar'; s.speak(u); rb.textContent = 'Parar'; };
})();
</script>
